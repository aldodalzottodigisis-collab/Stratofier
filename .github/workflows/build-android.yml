name: Compilar Stratofier APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y qt5-default qt5-qmake qtbase5-dev-tools qt5-qmake-bin qtbase5-dev build-essential

      - name: Compilar
        run: |
          mkdir build && cd build
          qmake ../Stratofier.pro -spec linux-g++ "CONFIG+=release"
          make -j$(nproc)

      - name: Aviso de éxito
        run: echo "Compilación terminada."
