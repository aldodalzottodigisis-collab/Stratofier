name: Compilar Stratofier APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Instalar Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android_armv7'
          # Esto evita que la acción intente usar el sistema de paquetes que está fallando
          setup-python: 'false'

      - name: Compilar el código fuente
        run: |
          mkdir build && cd build
          qmake ../Stratofier.pro -spec android-clang "CONFIG+=release"
          make -j$(nproc)
          # Esto genera los archivos de despliegue de Android
          make INSTALL_ROOT=android-build install
          androiddeployqt --input android-libStratofier.so-deployment-settings.json --output android-build --gradle --release
      
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Stratofier-APK
          path: build/android-build/build/outputs/apk/release/*.apk
