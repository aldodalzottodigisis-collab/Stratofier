name: Compilar Stratofier APK

# Esto permite que ejecutemos la compilación manualmente con un botón
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Instalar Java (JDK 11)
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Instalar entorno gráfico Qt 5.15
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android_armv7' # Compila para dispositivos Android comunes

      - name: Compilar el código fuente a APK
        run: |
          mkdir build && cd build
          # Preparar el proyecto Qt
          qmake ../Stratofier.pro -spec android-clang "CONFIG+=release"
          
          # Compilar
          make -j$(nproc)
          make install INSTALL_ROOT=android-build
          
          # Empaquetar el APK con las herramientas de Android de Qt
          androiddeployqt --input android-libStratofier.so-deployment-settings.json --output android-build --gradle --release
          
      - name: Guardar el APK generado
        uses: actions/upload-artifact@v3
        with:
          name: Stratofier-APK
          path: build/android-build/build/outputs/apk/release/*.apk
