name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: '6.10.0'
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '28.0.13004108'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install host (desktop) Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          modules: 'qtwebsockets'
          dir: '${{ github.workspace }}/qt'

      - name: Install Qt for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        id: qt-android
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtwebsockets'
          dir: '${{ github.workspace }}/qt'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Show qmake being used (sanity check)
        run: |
          which qmake
          qmake -v

      - name: Configure with qmake
        run: |
          mkdir -p build-android
          cd build-android
          qmake ../Stratofier.pro ANDROID_ABIS="arm64-v8a"

      - name: Build (make)
        run: |
          cd build-android
          make -j"$(nproc)"
          # Instala el .so en el sitio que androiddeployqt espera
          make INSTALL_ROOT=$PWD/android-build install || true
          # Alternativa moderna de Qt:
          make apk_install_target || true

      - name: Package APK with androiddeployqt
        run: |
          cd build-android
          androiddeployqt \
            --input android-Stratofier-deployment-settings.json \
            --output android-build \
            --android-platform "android-${ANDROID_API_LEVEL}" \
            --gradle \
            --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratofier-apk
          path: build-android/android-build/build/outputs/apk/**/*.apk
