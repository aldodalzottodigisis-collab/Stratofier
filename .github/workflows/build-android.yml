name: Compilar Stratofier APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias para Qt5
        run: |
          sudo apt-get update
          # qt5-default no existe en Ubuntu 22.04, usamos los paquetes base:
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools qt5-qmake build-essential

      - name: Compilar
        run: |
          mkdir build && cd build
          # Usamos qmake para generar el Makefile
          qmake ../Stratofier.pro CONFIG+=release
          make -j$(nproc)

      - name: Éxito
        run: echo "Compilación terminada con éxito."
