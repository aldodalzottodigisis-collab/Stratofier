name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;21.4.7075529"

      - name: Install Qt (Desktop, needed as host tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          dir: '${{ github.workspace }}/qt'

      - name: Install Qt for Android (armv7)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android_armv7'
          dir: '${{ github.workspace }}/qt'

      - name: Build APK
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/21.4.7075529
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          qmake Stratofier.pro \
            -spec android-clang \
            ANDROID_ABIS="armeabi-v7a"
          make -j$(nproc)
          make INSTALL_ROOT="$(pwd)/android-build" install
          androiddeployqt \
            --input android-Stratofier-deployment-settings.json \
            --output android-build \
            --android-platform android-30 \
            --gradle

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android-build -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratofier-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
